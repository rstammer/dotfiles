# Alacritty Configuration
# Based on omakub/DHH style preferences

[general]
import = []

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
decorations = "buttonless"
opacity = 0.95
blur = true

[scrolling]
history = 10000

[font]
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic = { family = "FiraCode Nerd Font Mono", style = "Light" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Medium" }
size = 14.0

[colors]
# Tokyo Night theme (popular in omakub setups)
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[keyboard]
bindings = [
  { key = "N", mods = "Command", action = "SpawnNewInstance" },
  { key = "Return", mods = "Command", action = "ToggleFullscreen" },
]

[mouse]
hide_when_typing = true